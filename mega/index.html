<!DOCTYPE html>
<html lang="en-AU" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#16375e">
<title>メガセンテンス · Unit 9</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23eef1f5'/%3E%3Ccircle cx='32' cy='24' r='11' fill='%2316375e'/%3E%3Cpath d='M13 56c0-11 8-18 19-18s19 7 19 18z' fill='%2316375e'/%3E%3C/svg%3E">
<style>
  /* Built to a school laptop: 1366 by 768 before the browser takes its
     cut. One step fills the screen, the page itself never scrolls, and
     exactly one region inside each step takes up the slack. Laptops are
     wide and short, so width buys back height wherever it can. */
  :root{
    --bg:#eef1f5; --paper:#fff; --ink:#15191f; --muted:#4a5464;
    --line:#ccd5e0; --line-soft:#e3e9f0;
    --deep:#16375e; --accent:#a83232; --ok:#2f6a3e; --warm:#8a6d1f;
    --i:#2b5f8c;            /* い adjectives, everywhere, always */
    --na:#7a4a86;           /* な adjectives, everywhere, always */
    --noun:#5a6470;         /* the things you describe */
    --font:Calibri,Carlito,'Segoe UI',Tahoma,Verdana,sans-serif;
    /* This page was the odd one out: it went straight to Hiragino Sans,
       a gothic, and skipped every textbook face, while the hub landing
       page and the oral app both lead with UD Digi Kyokasho. So a Year 8
       learning to form characters was being shown gothic strokes here
       and kyokasho strokes everywhere else in the suite.

       The stack is now the hub's, character for character. UD Digi
       Kyokasho is the UD textbook face and ships with Windows 10 and
       later, which is the school machines; a Mac falls to YuKyokasho,
       which is also a textbook face. An iPad has no kyokasho at all and
       lands on Hiragino, which is the one gap and not one a font stack
       can close. Nothing here is downloaded. */
    --jp:'UD Digi Kyokasho N-R','UD Digi Kyokasho NP-R','UD Digi Kyokasho NK-R','UD デジタル教科書体 N-R','UDデジタル教科書体N-R','HGP教科書体','HG教科書体','YuKyokasho Yoko',YuKyokasho,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',YuGothic,Meiryo,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:16px;line-height:1.5;display:flex;flex-direction:column;
       overflow:hidden}

  .bar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
       background:var(--paper);
       border-bottom:1px solid var(--line);padding:7px 14px;
       padding-top:calc(7px + env(safe-area-inset-top))}
  .bar h1{font-family:var(--jp);font-size:20px;font-weight:700;line-height:1.1}
  .bar h1 span{display:block;font-family:var(--font);font-size:11px;
       font-weight:600;letter-spacing:.08em;text-transform:uppercase;
       color:var(--muted)}
  .bar .sp{flex:1}
  .tool{min-height:38px;padding:0 11px;border:2px solid var(--deep);
        border-radius:9px;background:#fff;color:var(--deep);cursor:pointer;
        font-family:var(--font);font-size:13px;font-weight:700}
  .tool.off{border-color:var(--line);color:var(--muted)}

  /* The score is a readout, not a button. Every change to it says why,
     in the chip itself: the number moves and the reason sits next to it
     for a few seconds. A number that changes with no reason given is the
     one thing a student will not trust. */
  .pts{min-height:38px;display:flex;align-items:center;gap:5px;padding:0 11px;
       border:2px solid var(--warm);border-radius:9px;background:#fffbe9;
       color:var(--warm);font-size:13px;font-weight:700}
  .pts b{font-size:17px;color:var(--ink)}
  .pts i{font-style:normal;font-size:12px;font-weight:700}
  .pts i.up{color:var(--ok)}
  .pts i.down{color:var(--accent)}

  /* The step bar is a map, not a gate: every step is reachable from the
     first second, and the mark only reports what has been done. */
  .steps{flex:none;display:flex;background:var(--paper);
         border-bottom:1px solid var(--line);overflow-x:auto}
  .steps button{flex:1;min-width:92px;border:0;background:none;cursor:pointer;
       padding:7px 6px 6px;font-family:var(--font);color:var(--muted);
       border-bottom:3px solid transparent;text-align:center}
  .steps b{display:block;font-family:var(--jp);font-size:15px;color:var(--ink);
       font-weight:700;line-height:1.2}
  .steps i{display:block;font-style:normal;font-size:10.5px;
       letter-spacing:.05em;text-transform:uppercase}
  .steps .done{color:var(--ok);font-weight:700}
  .steps button[aria-current]{border-bottom-color:var(--deep)}
  .steps button[aria-current] i{color:var(--deep)}

  main{flex:1;min-height:0;display:flex;flex-direction:column;
       padding:10px 14px 12px;max-width:1180px;width:100%;margin:0 auto}
  .rule{flex:none;background:#fffbe9;border:1px solid #e0cf9a;border-radius:9px;
        padding:8px 11px;margin-bottom:9px;font-size:14px;line-height:1.45}
  .rule b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
        color:#7a6320;display:block;margin-bottom:2px}
  /* the how-to box folds away ten seconds in and leaves this chip */
  .rule{transition:opacity .4s}
  .rule.fading{opacity:0}
  main.folded > .rule{display:none}
  .howto{flex:none;align-self:flex-start;margin-bottom:9px;min-height:26px;
        padding:0 11px;border:1px solid #e0cf9a;background:#fffbe9;color:#7a6320;
        border-radius:999px;font:700 11px/1 var(--font);letter-spacing:.09em;
        text-transform:uppercase;cursor:pointer}
  .howto:hover{background:#fff6d8}
  @media (prefers-reduced-motion:reduce){ .rule{transition:none} }
  .rule .eg{font-family:var(--jp);font-size:15.5px;margin-top:4px}
  .rule .eg em{font-style:normal;font-family:var(--font);font-size:13px;
        color:var(--muted);margin-left:7px}
  .work{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
  /* the footer wraps. Five buttons and a line of help do not fit a
     360px phone on one row, and a row that does not wrap pushes the
     last of them off the side of the page. */
  .foot{flex:none;display:flex;align-items:center;gap:10px;margin-top:9px;
        flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .foot .hint{flex:1 1 auto;min-width:0}
  .foot .sp{flex:1}
  .hint{font-size:12.5px;color:var(--muted)}

  .btn{border:2px solid var(--deep);background:var(--deep);color:#fff;
       border-radius:9px;min-height:42px;padding:0 15px;cursor:pointer;
       font-family:var(--font);font-size:15px;font-weight:700}
  .btn.ghost{background:#fff;color:var(--deep)}
  .btn.sm{min-height:36px;font-size:13.5px;padding:0 11px}
  .btn[disabled]{opacity:.4;cursor:default}

  /* Colour is a taxonomy: い is always this blue, な always this purple,
     and a noun always grey, on every screen. Right and wrong are a tick
     or a cross and a word, never a colour on its own. */
  .k-i{color:var(--i)} .k-na{color:var(--na)} .k-noun{color:var(--noun)}
  .legend{flex:none;display:flex;gap:16px;font-size:12px;color:var(--muted);
       background:var(--paper);border-bottom:1px solid var(--line);
       padding:4px 14px}
  .legend s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .legend s:before{content:"";width:11px;height:11px;border-radius:3px;
       background:currentColor}
  .legend .k-i:before{background:var(--i)}
  .legend .k-na:before{background:var(--na)}
  .legend .k-noun:before{background:var(--noun)}

  .grid{display:grid;gap:8px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
         align-content:start}
  .card{border:2px solid var(--line);border-radius:9px;background:var(--paper);
        padding:9px 10px;cursor:pointer;font-family:var(--font);font-size:14px;
        text-align:left;color:inherit;min-height:52px}
  .card .ja{font-family:var(--jp);font-size:18px;display:block;line-height:1.5}
  /* A word card is the word and its play button side by side, not the
     button wrapping onto a line of its own. */
  #ja .card{display:flex;align-items:center;gap:9px}
  #ja .card .ja{flex:1;min-width:0}
  #six .card{display:flex;flex-direction:column;align-items:center;gap:4px}
  .card.pick{border-color:var(--deep);background:#eef3f9}
  .card.yes{border-color:var(--ok);background:#f1f8f2}
  .card.no{border-color:var(--accent);background:#fdf2f2}
  .card.gone{opacity:.25;pointer-events:none}
  ruby rt{font-size:.5em;font-weight:400;color:var(--muted)}
  body.nofuri ruby rt{visibility:hidden}
  /* ---- what the EN button hides ----
     Andrew: "what is the EN button on the top left of screen for in
     this app? Does it work? Where does it apply." It did nothing: it
     came across from ひと, where it hides the English line under a
     question, and this app has none of those.

     It now hides the English that is a prop rather than the task: the
     caption under each box in the builders, the line of help in the
     footer, and the translation that appears under a right answer.
     What it leaves alone is the English a task is made of, because
     hiding that would not make the task harder, it would make it
     impossible: the sentence to build in ことばでつくる, the meanings
     to match in ことば, the word to catch in the game, and the form
     being asked for in どうし.

     Where a tab has none of the first kind, the button says so by
     going flat rather than pretending. */
  body.noen .en,
  body.noen .box .ask,
  body.noen .foot .hint,
  body.noen .mark p{display:none}
  .tool[disabled]{opacity:.35;cursor:default}
  .en{font-size:12.5px;color:var(--muted);display:block}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
  .col{border:2px dashed var(--line);border-radius:9px;padding:8px;
       display:flex;flex-direction:column;min-height:0}
  .col h4{font-family:var(--jp);font-size:17px;margin-bottom:6px;flex:none}
  .col .in{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;
       gap:6px;align-content:flex-start}
  .col.i{border-color:var(--i)} .col.i h4{color:var(--i)}
  .col.na{border-color:var(--na)} .col.na h4{color:var(--na)}
  .chip{border:2px solid var(--line);border-radius:8px;background:var(--paper);
        padding:6px 10px;font-family:var(--jp);font-size:17px;cursor:pointer;
        color:inherit;min-height:40px}
  .chip.yes{border-color:var(--ok)} .chip.no{border-color:var(--accent)}
  .chip.pick{border-color:var(--deep);background:#eef3f9}
  .col{cursor:pointer} .col:focus{outline:2px solid var(--deep);outline-offset:2px}
  .chip.gone{opacity:.3;pointer-events:none}

  /* ---------- ことば: listen, then drag ----------
     touch-action is what lets a thumb drag a chip instead of scrolling
     the page out from under it. */
  .wslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
          gap:9px;align-content:start}
  .wslot{border:2px dashed var(--line);border-radius:10px;padding:8px 11px;
         min-height:64px;display:flex;align-items:center;gap:10px;
         background:var(--paper)}
  .wslot .mean{flex:1;font-size:15px}
  .wslot .got{font-family:var(--jp);font-size:19px;display:flex;
              align-items:center;gap:7px}
  .wslot.over{border-color:var(--deep);border-style:solid;background:#eef3f9}
  .wslot.yes{border-style:solid;border-color:var(--ok);background:#f1f8f2}
  .wslot.no{border-color:var(--accent);background:#fdf2f2}
  .wtray{display:flex;flex-wrap:wrap;gap:9px;flex:1}
  .wchip{width:76px;height:58px;border:2px solid var(--deep);border-radius:10px;
         background:var(--paper);color:var(--deep);display:flex;
         align-items:center;justify-content:center;cursor:grab;
         position:relative;touch-action:none;-webkit-user-select:none;
         user-select:none}
  .wchip .num{position:absolute;top:2px;left:6px;font-size:11px;
              font-weight:700;color:var(--muted)}
  .wchip svg{width:24px;height:24px}
  .wchip .jp{color:var(--ink)}
  .wchip.pick{background:#eef3f9;box-shadow:0 0 0 3px rgba(22,55,94,.18)}
  .wchip.dragging{position:fixed;z-index:60;pointer-events:none;cursor:grabbing;
         box-shadow:0 8px 20px rgba(0,0,0,.25);margin:0}
  @media (max-width:760px){
    .wslots{grid-template-columns:1fr 1fr}
    .wchip{width:62px;height:52px}
  }


  /* ---------- きせかえ: drag the clothes onto the figure ----------
     The drop targets live inside the SVG, so they scale with the drawing
     and a finger lands where it looks like it is landing. An empty one is
     a dashed outline, because an empty place has to look like a place. */
  /* The figure stays put while the trays scroll under it. On a phone the
     colours are below the fold, and a drag that starts on a chip has to
     end on a figure that is still on screen. */
  .dressfig{width:230px;position:sticky;top:0;align-self:flex-start;z-index:1}
  .dressfig .fig{max-height:360px;height:auto;width:100%}
  .zone{cursor:pointer;stroke:#8a97a8;stroke-width:1.1;stroke-dasharray:5 4;
        transition:fill-opacity .12s}
  .zone.full{stroke:none}
  .zone.over{fill-opacity:.16;stroke:var(--deep);stroke-width:2;stroke-dasharray:none}
  .zone.yes{stroke:var(--ok);stroke-width:2.2;stroke-dasharray:none}
  .zone.no{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:none}
  /* シャツ, Tシャツ and セーター all draw the same, so whatever is on a
     zone says its own name. */
  /* The label sits in the middle of its zone, which is exactly where a
     thumb aims. Without this it swallows the drop and a colour can never
     be put on the clothes it is for. */
  .ztag{fill:#fff;fill-opacity:.82;stroke:rgba(20,25,32,.28);stroke-width:.8;
        pointer-events:none}
  .ztxt{font-family:var(--jp);font-size:11px;fill:var(--ink);text-anchor:middle;
        pointer-events:none}
  .listen{flex-wrap:wrap;margin-bottom:7px}
  .listen .say{width:32px;height:32px;font-size:13px;font-weight:700}
  /* These chips carry a word, not an icon, so they are word-shaped. The
     fixed square of the ことば step wraps めがね onto two lines and spills
     it out of its own border. */
  .dress .wchip{width:auto;min-width:0;height:auto;min-height:44px;
       padding:4px 11px;white-space:nowrap}
  .dress .wchip .jp{font-size:18px;white-space:nowrap;line-height:1.3}
  .cchip{gap:7px}
  .cchip .sw{width:16px;height:16px;border-radius:3px;flex:none;
       border:1px solid rgba(20,25,32,.3)}
  #script p{margin-bottom:3px}
  /* On a phone the trays and the figure have to be on screen together.
     A drag cannot cross a scroll: if the chips are below the fold the
     gesture is impossible, not merely awkward. So this one keeps its two
     columns at every width and shrinks everything in them instead. */
  @media (max-width:760px){
    .who.dress{flex-direction:row;gap:9px}
    .dressfig{width:116px;margin:0}
    .dressfig .fig{max-height:238px}
    .dress .wchip{min-height:38px;padding:3px 8px}
    .dress .wchip .jp{font-size:16px}
    .dress .cchip{gap:5px}
    .dress .cchip .sw{width:13px;height:13px}
    .dress .tiles{gap:5px;margin-bottom:6px}
    /* a four-example rule is most of a phone screen, and the task is
       underneath it */
    .rule.tight{max-height:7.6em;overflow:auto}
  }
  @media (max-width:380px){
    .dressfig{width:98px}
    .dress .wchip{min-height:34px;padding:2px 7px}
    .dress .wchip .jp{font-size:15px}
  }

  .fig{display:block;margin:0 auto;height:100%;max-height:260px}
  .who{display:flex;gap:16px;align-items:flex-start;height:100%}
  .who .q{display:flex;flex-direction:column;min-height:0}
  #ta{flex:none}
  .who .pic{flex:none;width:150px}
  .who .q{flex:1;min-width:0}
  .jp{font-family:var(--jp);font-size:21px;line-height:1.7}
  .say{border:2px solid var(--deep);background:#fff;border-radius:8px;
       width:36px;height:36px;cursor:pointer;padding:0;color:var(--deep);
       font-size:15px;vertical-align:middle}
  body:not(.hasvoice) .say{display:none}

  .tiles{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
  .slot{min-height:52px;border:2px dashed var(--line);border-radius:9px;
        padding:7px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}

  textarea{width:100%;font-family:var(--jp);font-size:19px;line-height:1.7;
       border:2px solid var(--line);border-radius:9px;padding:9px 11px;
       resize:none;background:var(--paper);color:inherit}
  textarea:focus{border-color:var(--deep);outline:none}
  .mark{border-left:4px solid var(--line);padding:5px 10px;margin:6px 0;
        font-size:14px}
  .mark.yes{border-color:var(--ok)} .mark.no{border-color:var(--accent)}
  .mark.hm{border-color:#b8860b}
  .mark b{display:block;font-size:11px;letter-spacing:.08em;
        text-transform:uppercase;color:var(--muted)}
  /* the two sorting steps: the phrase the answer builds, right or wrong */
  .ph{font-family:var(--jp);font-size:18px;line-height:1.45;margin:2px 0}
  .ph i{font-style:normal;font-family:var(--font);font-size:11px;
        letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
        margin-right:8px}
  .ph.bad{color:var(--accent)}
  .mark .ph b{display:inline;font-size:inherit;letter-spacing:0;
        text-transform:none;color:var(--ok)}
  .ph .add{color:var(--ok)}
  .ph .sw,.chip .sw{display:inline-block;width:14px;height:14px;border-radius:3px;
        border:1px solid rgba(20,25,32,.35);vertical-align:-1px;margin-right:6px}
  .mark p{font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:3px}
  .mark .jp-in{font-family:var(--jp)}
  .mark .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .fbslot{flex:none;max-height:40vh;overflow:auto}
  .work.fit{flex:0 1 auto}
  /* A short screen (an older phone, or a laptop with a toolbar open)
     gives the rule box a scroll of its own rather than pushing the
     exercise off the bottom of the page. */
  @media (max-height:640px){
    .rule{max-height:72px;overflow:auto}
    .slot#pool{max-height:56px;overflow:auto}
    .col h4{font-size:15px;margin-bottom:4px}
  }
  .fbslot .mark{margin:8px 0 0}
  /* the one thing a drawing cannot say, handed over in English on the
     writing step so the student has something true to write */
  .brief{margin-top:8px;font-size:12.5px;line-height:1.4;
       color:var(--muted);text-align:center}
  .brief b{color:var(--ink);font-weight:700}
  /* ---- the かさおばけ ----
     Fixed, so it drifts over whatever is on screen, and pointer-events
     none so it can never swallow a tap meant for the feedback under it.
     Floats up and fades; the small sway stops it reading as a sprite on
     a rail. */
  /* Which build is on screen. Without it there is no way to tell a
     change that did not work from a change that never arrived, and that
     question cost Andrew three rounds of asking for the same thing. */
  .build{position:fixed;right:4px;bottom:2px;z-index:70;pointer-events:none;
     font-family:var(--font);font-size:9px;letter-spacing:.04em;
     color:var(--line);user-select:none}
  .yoka,.ninj{position:fixed;z-index:60;pointer-events:none}
  .yoka{transform:translate(-50%,0);animation:yfloat 1.6s ease-out forwards}
  /* The ninja crosses and is gone in 0.7s. Right should be acknowledged
     and then got out of the way of: it is the thing you want to be
     unremarkable and repeatable, so it cannot take as long as being
     wrong does. */
  .ninj{transform:translate(-50%,-50%);animation:ndash .7s cubic-bezier(.2,.8,.3,1) forwards}
  .ninj svg{display:block;filter:drop-shadow(0 2px 5px rgba(20,25,32,.3))}
  @keyframes ndash{
    0%{opacity:0;transform:translate(-190%,-50%) scale(.9)}
    22%{opacity:1}
    70%{opacity:1;transform:translate(-20%,-54%) scale(1)}
    100%{opacity:0;transform:translate(120%,-58%) scale(.96)}
  }
  .yoka svg{display:block;filter:drop-shadow(0 2px 6px rgba(20,25,32,.25))}
  @keyframes yfloat{
    0%{opacity:0;transform:translate(-50%,10px) scale(.84) rotate(-4deg)}
    18%{opacity:.95}
    55%{transform:translate(-42%,-70px) scale(1) rotate(5deg)}
    100%{opacity:0;transform:translate(-56%,-150px) scale(1.02) rotate(-3deg)}
  }
  /* ---- reduced motion ----
     Not hidden. Hiding them was the whole reason Andrew could not see
     either one. What that setting is for is movement across the screen,
     so under it the pair simply fade in where they are and fade out
     again, and the feedback survives. */
  @media (prefers-reduced-motion:reduce){
    .ninj,.yoka{animation-name:cfade;animation-duration:1.1s;
      animation-timing-function:ease-out}
    @keyframes cfade{
      0%{opacity:0} 18%{opacity:1} 70%{opacity:1} 100%{opacity:0}
    }
  }

  /* ---- the drum, lifted with the module from the oral app ---- */
  .rwin{position:relative;flex:1;min-width:0;height:192px;overflow:hidden;
        background:var(--paper);border:1px solid var(--line);border-radius:9px;
        touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;
        -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%,
                           #000 76%,transparent 100%);
        mask-image:linear-gradient(to bottom,transparent 0,#000 24%,
                   #000 76%,transparent 100%)}
  .reel.spinning .rwin{cursor:default}
  .rwin:active{cursor:grabbing}
  .rstrip{will-change:transform}
  .ritem{height:64px;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:1px;text-align:center;padding:0 10px}
  .ritem b{font-size:clamp(16px,5vw,21px);font-weight:600;line-height:1.15;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
           max-width:100%}
  .ritem i{font-style:normal;font-size:12px;color:var(--muted);
           letter-spacing:.04em}
  .rmark{position:absolute;left:0;right:0;top:64px;height:64px;
         pointer-events:none;border-top:2px solid var(--deep);
         border-bottom:2px solid var(--deep);background:rgba(0,0,0,.035)}
  .reel{display:flex;align-items:center;gap:9px;margin:2px 0 10px}
  .rspin{flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;
         padding:0;border:2px solid var(--line);background:var(--paper);
         color:var(--deep);display:flex;align-items:center;
         justify-content:center;opacity:.78;transition:opacity .13s}
  .rspin:hover,.rspin:focus{opacity:1;border-color:var(--deep);outline:none}
  .rspin svg{width:21px;height:21px}
  .reel.spinning .rspin{opacity:.3;pointer-events:none}
  .ask-en{font-size:15px;color:var(--muted);margin:2px 0 7px}
  .ask-en b{color:var(--ink);font-size:17px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #sin{flex:1;min-width:0;font-family:var(--jp);font-size:22px;
       border:2px solid var(--line);border-radius:9px;padding:8px 11px;
       background:var(--paper);color:inherit}
  #sin:focus{border-color:var(--deep);outline:none}
  /* 〜くて: the frame carries は and です so that no tile announces
     where it goes, and a gap is a gap rather than an empty box. */
  .jline{margin:10px 0;font-size:21px;line-height:1.9}
  .jline .gap{text-decoration:none;border-bottom:3px solid var(--line);
       padding:0 10px;color:var(--muted)}
  .chip .gl{display:block;font-family:var(--font);font-size:11.5px;
       font-style:normal;font-weight:600;color:var(--muted);margin-top:1px}
  /* ことばキャッチ: the canvas is 320 by 200 whatever size it is drawn at,
     and the browser is told not to smooth it, so every pixel arrives as a
     square. The coarseness is the point, not a filter over it.

     Landscape, because several words have to be in the air at once and a
     portrait screen only fits one. The question sits above the screen in
     ordinary page text, not in the pixels: it is the one thing here that
     is not meant to be a game. */
  .arcadewrap{display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:8px;padding:4px 0;min-height:0}
  /* The question. It is pinned to the top of the scrolling area, so no
     amount of scrolling can put it off the screen, and it carries a word
     from the moment the rung opens rather than a dash until somebody
     presses Start. */
  .prompt{position:sticky;top:0;z-index:4;align-self:stretch;
       display:flex;align-items:baseline;justify-content:center;gap:12px;
       padding:7px 18px;border:2px solid #8a6d1f;border-radius:10px;
       background:#fffbe9}
  .prompt .lab{font-size:11px;font-weight:700;letter-spacing:.14em;
       color:#8a6d1f}
  .prompt b{font-size:27px;line-height:1.2;color:var(--ink)}
  @media (max-width:700px){ .prompt b{font-size:21px} }
  .arcade{display:block;height:auto;width:min(100%,900px);
       aspect-ratio:320/200;background:#000;border:3px solid #2f8f2f;
       border-radius:6px;cursor:none;touch-action:none;
       image-rendering:pixelated;image-rendering:crisp-edges}
  .arcade:focus{outline:2px solid #6cf06c;outline-offset:2px}
  @media (max-width:700px){
    .prompt b{font-size:19px} .arcade{width:100%}
  }
  /* On the game step the page scrolls, which it does nowhere else here.
     Andrew: "The explanation of the game in the yellow box is getting in
     the way on a laptop browser. Let it scroll out of view to maximise
     the view of game play."

     So main becomes the scroller, the game is given a whole screenful of
     its own below the explanation, and the footer is pinned to the
     bottom so Start and the score stay reachable wherever you have
     scrolled to. Pressing Start scrolls the screen up for you, because
     the first thing a student does is press Start and the next thing
     they need is all of the screen. */
  body.gamefull main{overflow-y:auto;overscroll-behavior:contain}
  body.gamefull .arcadewrap{flex:none;overflow:visible}
  body.gamefull .foot{position:sticky;bottom:0;z-index:3;margin-top:0;
       padding:7px 0 2px;background:var(--bg)}
  .score{font-size:13px;color:var(--muted)}
  .score b{color:var(--ink);font-size:16px}
  /* Seven tools and a score will not sit on one line of a 320px phone,
     and at full size they took four rows with them. The bar is the least
     interesting thing on the page and should take the least room. */
  @media (max-width:420px){
    .bar{gap:6px;padding:5px 9px}
    .bar h1{font-size:17px}
    .tool{min-height:32px;padding:0 7px;font-size:11.5px}
    .pts{min-height:32px;padding:0 8px;font-size:11.5px}
    .pts b{font-size:15px}
  }
  @media (max-width:760px){
    .bar{padding:6px 10px} .tool{padding:0 8px;font-size:12px}
    .legend{padding:4px 10px;gap:12px}
    .steps button{min-width:78px} .steps b{font-size:13.5px}
  }
  @media (max-width:700px){
    .who{flex-direction:column} .who .pic{width:120px;margin:0 auto}
    main{padding:8px 10px 10px}
  }

  /* ================= the sentence builder =================
     Five boxes in the order the frame goes, each with its particle
     printed under it and the question it answers under that. The
     particle is in its own line because it is the lesson: a word moves
     from the tray into a box, and what it picks up there is the
     particle.

     A box is a fixed square whatever is in it, so nothing on the line
     moves as pieces land. Same reason the kanji timer has fixed
     columns: a layout that reflows while a student is working is a
     layout they have to re-read. */
  .frame{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
       margin:2px 0 12px}
  .box{width:104px;border:2px dashed var(--line);border-radius:12px;
       background:var(--paper);padding:7px 5px 5px;text-align:center}
  .box.over{border-color:var(--deep);background:#eef4fb}
  .box.right{border-style:solid;border-color:var(--ok)}
  .box.wrong{border-style:solid;border-color:var(--accent)}
  .box.verb{border-style:solid;border-color:var(--line-soft);background:#f6f8fb}
  .hole{height:58px;display:flex;align-items:center;justify-content:center}
  .hole .pic{font-size:38px;line-height:1}
  .hole .pja{font-family:var(--jp);font-size:17px;line-height:1.25}
  /* no ghost picture in an empty box: it took the decision away */
  .gapsm{width:8px}
  .box .part{font-family:var(--jp);font-size:19px;font-weight:700;
       color:var(--deep);line-height:1.2;min-height:1.2em}
  .box .ask{font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:2px}

  .tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
       margin:4px 0 2px}
  /* the palette is every picture in the unit at once, which is the
     point of it: a student goes looking */
  .tray.palette{gap:6px;max-height:34vh;overflow:auto;padding:4px}
  .tray.palette .piece{min-width:52px;padding:4px 6px}
  .tray.palette .piece .pic{font-size:30px}
  .target{text-align:center;font-size:15.5px;margin:0 0 8px;color:var(--ink)}
  .piece{position:relative;border:1.5px solid var(--line);border-radius:12px;
       background:var(--paper);cursor:grab;padding:6px 8px;min-width:62px;
       display:flex;flex-direction:column;align-items:center;gap:2px;
       touch-action:none;font-family:var(--font)}
  .piece .pic{font-size:34px;line-height:1}
  .piece .pic.small{font-size:19px;line-height:1}
  /* a day piece carries its kanji under the element it is named after:
     水 is water, which is why Wednesday is 水曜日 */
  .badge{display:block;font-family:var(--jp);font-size:15px;line-height:1.1;
       color:var(--deep);margin-top:1px}
  .hole .badge{font-size:16px}
  .piece.word{min-width:84px}
  .piece.wide{min-width:132px}
  .piece .pja{font-family:var(--jp);font-size:18px;line-height:1.3}
  /* 絵＋ことば: the picture with the word under it, which is the rung
     between a picture task and a reading one */
  .piece.lvl-both{min-width:78px}
  .piece.lvl-both .pic{font-size:28px}
  .piece.lvl-both .pja{font-size:15px}
  .hole .pic + .pja{display:block;font-size:13px;margin-top:1px}
  /* the English is face down until the ？ is pressed */
  .piece .pen{font-size:11.5px;color:var(--muted);visibility:hidden;
       max-height:0;transition:none}
  .piece.flipped .pen{visibility:visible;max-height:none}
  .piece.flipped{border-color:#b8860b;background:#fffbe9}
  .qq{position:absolute;top:-7px;right:-7px;width:21px;height:21px;
       border-radius:50%;border:1.5px solid var(--line);background:var(--paper);
       font-size:11px;line-height:18px;color:var(--muted);cursor:help}
  .piece.pick{border-color:var(--deep);box-shadow:0 0 0 3px #dce8f6}
  .piece.dragging{position:fixed;z-index:80;opacity:.94;cursor:grabbing;
       box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .piece.ok{border-color:var(--ok);background:#eefaf0}
  .piece.no{border-color:var(--accent);background:#fdeeee}

  /* ---- matching ---- */
  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;
       margin:0 auto}
  .mcol{display:flex;flex-direction:column;gap:7px}
  .mcol .piece{width:100%}
  .slot{display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 9px;
       border:2px dashed var(--line);border-radius:11px;background:var(--paper)}
  .slot.over{border-color:var(--deep);background:#eef4fb}
  .slot.filled{border-style:solid;border-color:var(--ok);background:#eefaf0}
  .slot .men{font-size:13.5px}
  .slot .pja{font-family:var(--jp);font-size:16px}

  #promptw.jp{font-family:var(--jp)}
  #promptw.big{font-size:clamp(28px,5vw,44px);line-height:1.1}
  /* ---- \u3057\u308a\u3068\u308a: the chain ---- */
  /* ---- タイプ: the typing race ----
     The word to aim at, large; what has been made under it; and the
     letters still in the air after that, the way an IME underlines
     what it has not turned into kana yet. No romaji is ever set in
     the reading face: those few grey letters are keystrokes. */
  .tcount{font-size:12.5px;color:var(--muted);margin:0 0 6px}
  .tword{font-size:clamp(38px,8vw,72px);line-height:1.15;margin:0 0 4px}
  .ten{font-size:15px;color:var(--muted);margin:0 0 22px}
  .ttyped{font-size:clamp(30px,6vw,52px);line-height:1.2;min-height:1.3em;
       border-bottom:2px solid var(--line);display:inline-block;
       min-width:min(440px,80vw);padding:0 10px 4px}
  .tok{color:var(--ok)}
  .tbad{color:var(--accent)}
  .tair{font-family:var(--font);font-size:.55em;color:var(--muted);
       text-decoration:underline;vertical-align:middle;margin-left:2px}
  .chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
       gap:7px;margin:0 0 16px;min-height:40px}
  .link{font-family:var(--jp);font-size:19px;border:1.5px solid var(--line);
       border-radius:999px;padding:5px 14px;background:var(--paper)}
  .link.on{border-color:var(--deep);background:#eaf2fb;font-weight:700}
  .chain .arrow{color:var(--muted);font-size:15px}
  .ask{text-align:center;margin:0 0 14px}
  .need{font-size:clamp(40px,8vw,66px);line-height:1.1;color:var(--deep)}
  .tray.wide{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  /* no display here: the global .en is already block, and setting it
     again would out-specify body.noen .en and defeat the EN button */
  .piece.word.wide .en{font-size:12px;color:var(--muted);margin-top:2px}
  .piece.word.wide.ok{border-color:var(--ok);background:#eefaf0}
  .piece.word.wide.no{border-color:var(--accent);background:#fdf0f0}
  /* ---- the memory game ----
     A card is a square that turns over. The back carries one character
     so a board of them still looks like Japanese, and the front holds
     a word, a meaning, a kana or a picture: the grid is fixed so the
     board does not reflow as cards are taken, because remembering
     where a card was is the whole game. */
  /* width:100% is load-bearing. The board is a flex item in a column
     flex container, and `margin:0 auto` on a flex item stops it
     stretching: it sizes to its content instead. With columns of
     minmax(66px,1fr) and no width to share out, every 1fr resolved to
     its 66px minimum, so a 1366px screen drew a 294px board of 66px
     cards and the faces had to shrink to 9px to fit inside them. That
     is what was really behind words spilling out of the cards. */
  .board{display:grid;grid-template-columns:repeat(4,minmax(66px,1fr));gap:10px;
       width:100%;max-width:min(680px,92vw);margin:0 auto}
  /* min-width:0 is load-bearing. A grid item will not shrink below its own
     min-content width unless it is told it may, so a column set to 38px on
     a small phone still drew a 52px card: the widest word inside it held
     the card open and the whole board overflowed. The words are measured
     and shrunk to fit the card, so the card must be free to be as small as
     the board needs. */
  .card{position:relative;aspect-ratio:1;border:0;background:none;padding:0;
       min-width:0;min-height:0;
       cursor:pointer;font-family:var(--font);perspective:600px}
  .card .back,.card .front{position:absolute;inset:0;display:flex;align-items:center;
       justify-content:center;border-radius:12px;border:1.5px solid var(--line);
       padding:4px;text-align:center;line-height:1.25;overflow:hidden;
       transition:opacity .18s, transform .18s}
  /* The back used to carry 日, for no reason beyond its being a simple
     symmetrical kanji. Every card showing the same one made the deck look
     like a flashcard for 日, which is not what the game is about. It is
     青海波 now: a card back, which is what it is. */
  .card .back{background-color:var(--deep);color:#fff;font-family:var(--jp);font-size:26px;
       border-color:var(--deep)}
  .card .front{background:var(--paper);font-size:21px;opacity:0;transform:scale(.94)}
  /* the face's own box: what the fitting measures, and the only thing in
     the card that knows how tall the words actually are */
  /* No breaking inside a word. "Wednesday" split across two lines as
     "Wednesda / y" reads as a typo, and a student matching words should
     not have to work out which one they are looking at. An English word
     that will not fit on a line overflows instead, which the fitting
     sees and answers by making the type smaller until the word fits.
     Japanese needs nothing here: it breaks between characters anyway. */
  .card .front .fc{display:block;max-width:100%;
       word-break:normal;overflow-wrap:normal}
  /* These are starting sizes for a full-size card, not final ones. The
     page measures each face and brings it down until it fits the card it
     is actually in, so a generous start costs nothing and a mean one
     cannot be undone: the fitting only ever shrinks. */
  .card .front.jp{font-family:var(--jp);font-size:30px}
  .card .front.pic{font-size:46px}
  .card.up .back,.card.got .back{opacity:0}
  .card.up .front,.card.got .front{opacity:1;transform:none}
  .card.got .front{border-color:var(--ok);background:#eefaf0}
  .card.got{cursor:default}
  .scoreline{display:flex;gap:10px;justify-content:center;margin:0 0 10px}
  .pl{font-size:13.5px;color:var(--muted);border:1.5px solid transparent;
       border-radius:999px;padding:3px 12px}
  .pl.on{border-color:var(--deep);color:var(--ink);background:var(--paper)}
  .pl b{font-size:16px}
  @media (prefers-reduced-motion:reduce){
    .card .back,.card .front{transition:none}
  }
  @media (max-width:560px){
    .board{grid-template-columns:repeat(4,minmax(58px,1fr));gap:6px}
    .card .front{font-size:12.5px}
    .card .front.jp{font-size:17px}
  }
  /* ---- a phone turned sideways ----
     390px of height, and the bar, the rung list, the scoreline and three
     wrapped rows of buttons leave about fifty pixels for the board: one
     row of cards, which is not a memory game. None of that furniture
     needs to be full size on a screen this short, and every pixel it
     gives back is a pixel of card. */
  @media (max-height:500px){
    /* The rung bar carries the English under every Japanese label, which
       is 24px of a 390px screen spent saying what the student is already
       looking at. The Japanese stays; the English comes back the moment
       there is room for it. */
    .steps i{display:none}
    .steps button{padding:5px 8px}
    main{padding:6px 10px 8px}
    .scoreline{margin-bottom:4px}
    .pl{font-size:12px;padding:1px 9px}
    .pl b{font-size:14px}
    .foot{margin-top:5px;gap:6px}
    .foot .btn.sm{min-height:30px;font-size:12px;padding:0 8px}
    .work.fit > .col{padding:4px}
  }
  /* ---- クイズ, the projector quiz ----
     Sized for the back row of a classroom, not for a laptop at arm's
     length. Everything scales off the viewport, because the one thing
     that must never happen is a question nobody can read. */
  .quiz{display:flex;flex-direction:column;gap:14px;min-height:62vh}
  /* ---- traditional patterns, in CSS ----
     Andrew asked for the scoreboard to look like something, and for
     festival patterns rather than decoration. These are four of the
     ordinary ones, drawn with gradients so there is no image to
     download and nothing to license:

       sei    青海波, the nested wave arcs on kimono and crockery
       ichi   市松, the two-tone check
       hishi  菱, the diamond lattice
       uroko  鱗, overlapping scales

     The third one was called 矢絣 in an earlier draft and drew diamonds,
     which are 菱 and not arrow feathers. Naming a pattern after something
     it is not is the sort of thing that survives for years, so it is
     named after what it draws.

     Each one draws in white over whatever colour it is put on, so one
     set of rules serves four teams and the card backs. */
  .pat-sei{background-image:
     radial-gradient(circle at 50% 100%,transparent 17%,rgba(255,255,255,.26) 18%,
       rgba(255,255,255,.26) 23%,transparent 24%,transparent 40%,
       rgba(255,255,255,.26) 41%,rgba(255,255,255,.26) 46%,transparent 47%,
       transparent 63%,rgba(255,255,255,.26) 64%,rgba(255,255,255,.26) 69%,
       transparent 70%);
     background-size:36px 18px}
  .pat-ichi{background-image:
     linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 75%,
       rgba(255,255,255,.2) 75%),
     linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 75%,
       rgba(255,255,255,.2) 75%);
     background-size:26px 26px;background-position:0 0,13px 13px}
  .pat-hishi{background-image:
     linear-gradient(135deg,rgba(255,255,255,.22) 25%,transparent 26%),
     linear-gradient(225deg,rgba(255,255,255,.22) 25%,transparent 26%),
     linear-gradient(45deg,rgba(255,255,255,.22) 25%,transparent 26%),
     linear-gradient(315deg,rgba(255,255,255,.22) 25%,transparent 26%);
     background-size:22px 22px}
  .pat-uroko{background-image:
     linear-gradient(135deg,rgba(255,255,255,.26) 25%,transparent 26%),
     linear-gradient(225deg,rgba(255,255,255,.26) 25%,transparent 26%);
     background-size:20px 20px}

  .qteams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  /* A scoreboard a class can read from the back row and tell apart at a
     glance: its own colour, its own pattern, and the colour's name under
     the number, which is four more words of Japanese on the wall. */
  .qteam{position:relative;overflow:hidden;min-width:104px;
       border:2px solid var(--tc,var(--line));border-radius:12px;
       background-color:var(--tc,#fff);color:#fff;padding:7px 12px 8px;
       text-align:center;transition:transform .18s ease,box-shadow .18s ease}
  .qteam .no{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;
       opacity:.85}
  .qteam .pt{display:block;font-family:var(--font);font-size:clamp(26px,4vw,40px);
       font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .qteam .nm{display:block;font-family:var(--jp);font-size:12.5px;opacity:.9}
  .qteam.won{transform:scale(1.07);box-shadow:0 0 0 4px rgba(255,255,255,.55),
       0 6px 18px rgba(0,0,0,.28)}
  @media (prefers-reduced-motion:reduce){
    .qteam{transition:none}
    .qteam.won{transform:none}
  }
  .qcard{flex:1;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:16px;text-align:center;padding:12px}
  .qtag{font-family:var(--jp);font-size:13px;color:var(--muted);letter-spacing:.08em}
  .qask{font-size:clamp(28px,5.4vw,58px);line-height:1.25;max-width:22ch}
  .qask.jp{font-family:var(--jp);font-size:clamp(44px,9vw,110px)}
  .qans{font-family:var(--jp);font-size:clamp(32px,6vw,72px);line-height:1.3;
       color:var(--ok);max-width:24ch}
  /* an answer that is English is set in the reading font at a size the
     back row can still read, but never in the Japanese face */
  .qans.en{font-family:var(--font);font-size:clamp(28px,4.6vw,54px)}
  /* the gloss under a reading: there, and clearly the smaller of the
     two, because the reading is what was asked for */
  .qsub{font-family:var(--font);font-size:clamp(17px,2.4vw,27px);color:var(--muted)}
  /* the controls stay on the screen whatever the question does above
     them: a teacher cannot award a point to a button that has been
     pushed off the bottom */
  .qbar{display:flex;gap:10px;align-items:center;justify-content:center;
       flex-wrap:wrap;padding:10px 0;position:sticky;bottom:0;z-index:2;
       background:var(--bg)}
  .qcard{min-height:0}
  .qask.len2{font-size:clamp(24px,4.2vw,44px)}
  .qask.len3{font-size:clamp(20px,3vw,34px)}
  .qask.jp.len2{font-size:clamp(34px,6vw,76px)}
  .qask.jp.len3{font-size:clamp(26px,4vw,50px)}
  .qans.len2{font-size:clamp(26px,4.4vw,52px)}
  .qans.len3{font-size:clamp(21px,3.1vw,38px)}
  .qans.en.len2{font-size:clamp(24px,3.6vw,42px)}
  .qans.en.len3{font-size:clamp(20px,2.8vw,32px)}
  .qwho{font-size:14px;color:var(--muted)}
  .btn.big{font-size:19px;padding:12px 26px}
  .btn.qpt{font-size:22px;min-width:62px;padding:10px 18px}
  .qfin{font-family:var(--font);font-size:20px;color:var(--ink);margin:0 10px}
  .qsetup{max-width:620px;margin:0 auto}
  .qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .qlab{font-size:13px;color:var(--muted);min-width:118px}
  /* It was written for the setup screen, where the same instruction was
     already in the rule box above it. It now sits under the question on
     the play screen, which is where a teacher at a projector wants it, so
     it has to behave as a flex child and get out of the way on a short
     screen. */
  .qkeys{flex:none;text-align:center;font-size:12.5px;color:var(--muted);
         line-height:1.4;margin:0;padding:2px 10px 4px}
  @media (max-height:620px){ .qkeys{display:none} }
  body.gamefull .quiz{min-height:74vh}
  @media (max-width:560px){
    .qask{font-size:clamp(24px,7vw,34px)}
    .qask.jp{font-size:clamp(38px,13vw,60px)}
    .qans{font-size:clamp(26px,8vw,40px)}
  }
  /* ---- かるた ----
     The cards sit face up and large: this is a listening race read
     from across a desk, not a grid to lean into. A wrong grab shakes
     and stays on the table, because the card is still the answer to a
     call that has not come yet. */
  .board.tori{grid-template-columns:repeat(3,minmax(92px,1fr));max-width:min(560px,94vw)}
  .board.tori .card .front{font-size:17px}
  .board.tori .card .front.jp{font-size:clamp(20px,4.2vw,30px)}
  .board.tori .card .front.pic{font-size:clamp(34px,7vw,52px)}
  .card.miss .front{border-color:var(--accent);background:#fdf0f0;
       animation:shake .34s}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}
  }
  .callbar{display:flex;align-items:center;justify-content:center;gap:12px;
       flex-wrap:wrap;margin:0 0 12px}
  .callnote{font-size:13px;color:var(--muted)}
  /* a display rule beats the attribute, so the attribute has to win */
  [hidden]{display:none !important}
  /* the English under a label sits on a filled button here, where the
     muted grey it uses everywhere else is unreadable */
  #again2 .en{color:#cfdcea}

  /* ---- かるた, the two players ----
     Andrew: "make the score cards bigger and a striking colour. The game
     cards can be slightly smaller if needed." So the scoreboard is the
     team quiz's, which he liked: the panel carries its own colour and
     its own 和柄, and the number is big enough to read from the other
     side of a desk. The table underneath sizes itself to whatever room
     is left, so a bigger scoreboard costs a few millimetres of card and
     nothing else.

     It is also where the game says what to do. Taking turns, the player
     whose go it is lights up and the other dims; racing, each panel
     carries its own buzzer with its key under it. */
  .kteams{display:flex;gap:12px;justify-content:center;margin:0 0 10px}
  .kteam{position:relative;overflow:hidden;flex:1;max-width:260px;
       border:2px solid var(--tc,var(--line));border-radius:14px;
       background-color:var(--tc,#fff);color:#fff;padding:8px 10px 10px;
       text-align:center;transition:transform .18s ease,box-shadow .18s ease,
       opacity .18s ease}
  .kteam .nm{display:block;font-family:var(--jp);font-size:15px;opacity:.95}
  .kteam .pt{display:block;font-family:var(--font);font-weight:700;
       font-size:clamp(30px,5.4vw,48px);line-height:1.02;
       font-variant-numeric:tabular-nums}
  .kteam .go{display:block;font-family:var(--jp);font-size:14px;line-height:1.15}
  .kteam .go i{display:block;font-family:var(--font);font-style:normal;
       font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .kteam.turn{box-shadow:0 0 0 4px rgba(255,255,255,.55),0 6px 18px rgba(0,0,0,.28)}
  .kteam.off{opacity:.45}
  /* the buzzer lives inside its own panel, so the colour you press is
     the colour that scores */
  .kteam .bz{display:block;width:100%;margin-top:4px;border:0;border-radius:10px;
       background:rgba(255,255,255,.92);color:var(--tc,var(--ink));cursor:pointer;
       font-family:var(--jp);font-size:17px;font-weight:700;padding:5px 6px 6px}
  .kteam .bz i{display:block;font-family:var(--font);font-style:normal;
       font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
       opacity:.75}
  .kteam .bz:active{background:#fff;transform:translateY(1px)}
  /* ---- the same scoreboard, lying down ----
     The tall panel with the big number is for a laptop or a projector.
     On a phone, or on anything short, it has to be a strip instead:
     name, score and buzzer in a row. A 144px scoreboard on a 390px
     phone leaves the table 43px cards, and Andrew asked for the score
     to be bigger, not for the game to be unplayable. The colour and the
     pattern do the standing out, which they do just as well lying down. */
  @media (max-width:560px), (max-height:500px){
    .kteams{gap:8px}
    .kteam{display:flex;align-items:center;justify-content:center;gap:9px;
         padding:4px 9px;max-width:none}
    .kteam .nm{font-size:13px}
    .kteam .pt{font-size:26px;line-height:1}
    .kteam .go{font-size:12.5px}
    .kteam .go i{display:none}
    .kteam .bz{width:auto;margin:0;font-size:15px;padding:3px 10px}
    .kteam .bz i{display:none}
  }
  /* ---- かるた on a phone turned sideways ----
     390px of height, and the bar and the rungs take 158 of it before
     anything else. Stacked, the scoreboard and the play-it-again button
     leave the table 24px cards, which is not a tap target.

     So on a short screen the scoreboard goes down the SIDES instead:
     one player's panel at each edge, the table between them, the button
     above it. Height is what a sideways phone has none of and width is
     what it has plenty of, and two players sitting at one laptop are
     already on their own sides of it. */
  @media (max-height:500px){
    .col.kar{display:grid;
         grid-template-columns:minmax(84px,auto) minmax(0,1fr) minmax(84px,auto);
         grid-template-rows:auto 1fr auto;align-content:start;gap:6px 9px}
    .col.kar #who{display:contents}
    .col.kar #who .pl{grid-column:1;grid-row:1}
    .col.kar .kteam:first-child{grid-column:1;grid-row:1}
    .col.kar .kteam:last-child{grid-column:3;grid-row:1 / span 2}
    /* the play-it-again button tucks under the left panel, so the table
       keeps the whole height of the column beside it */
    .col.kar .callbar{grid-column:1;grid-row:2;margin:0;align-self:start;
         justify-content:flex-start}
    .col.kar .callnote{display:none}
    .col.kar .board{grid-column:2;grid-row:1 / span 2}
    .col.kar .fbslot{grid-column:1 / -1;grid-row:3}
    /* down the side there is height again, so the panel stands up */
    .col.kar .kteam{display:block;align-self:stretch;padding:5px 7px}
    .col.kar .kteam .pt{font-size:28px}
    .col.kar .kteam .go{font-size:12px}
    .col.kar .kteam .bz{width:100%;margin-top:4px}
  }
  @media (prefers-reduced-motion:reduce){ .kteam{transition:none} }
  @media (prefers-reduced-motion:reduce){ .card.miss .front{animation:none} }
  @media (max-width:560px){
    .board.tori{grid-template-columns:repeat(3,minmax(74px,1fr));gap:7px}
  }
  /* ---- katakana ---- */
  .kagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
       gap:8px;max-width:900px;margin:0 auto}
  .kacard{border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
       padding:8px 5px 6px;cursor:pointer;text-align:center;font-family:var(--font)}
  .kacard .kaface{display:block;font-family:var(--jp);font-size:21px;line-height:1.3}
  /* the English waits to be asked for, the same as the kanji grid: a
     page of words with their meanings beside them is a page to read,
     not a page to practise reading */
  .kacard .kaen{display:block;font-size:11.5px;color:var(--muted);visibility:hidden}
  .kacard.open .kaen,.kacard.seen .kaen{visibility:visible}
  .kacard.seen{border-color:var(--ok);background:#f4fbf5}
  .kask{text-align:center;margin:8px 0 12px}
  .kabig{font-family:var(--jp);font-size:clamp(34px,8vw,62px);line-height:1.2}
  .kaopt{font-size:22px}
  .piece .pen.open{visibility:visible;max-height:none;font-size:14px;color:var(--ink)}
  /* ---- the kanji grid ----
     A card is the kanji alone until it is tapped. The reading and the
     meaning are underneath it and hidden, so the grid is a page of
     kanji to read rather than a page of answers. */
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
       gap:8px;max-width:860px;margin:0 auto}
  .kcard{border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
       padding:8px 4px 6px;cursor:pointer;text-align:center;font-family:var(--font)}
  .kcard .kface{display:block;font-family:var(--jp);font-size:30px;line-height:1.2}
  .kcard .kyomi{display:block;font-family:var(--jp);font-size:14px;color:var(--deep);
       visibility:hidden}
  .kcard .ken{display:block;font-size:11px;color:var(--muted);visibility:hidden}
  .kcard.open .kyomi,.kcard.open .ken{visibility:visible}
  .kcard.seen{border-color:var(--ok);background:#f4fbf5}
  .kask{text-align:center;margin:6px 0 10px;display:flex;flex-direction:column;
       align-items:center;gap:6px}
  .kq{font-size:13.5px;color:var(--muted)}
  .kmean{font-size:clamp(20px,4vw,30px);font-weight:600}
  .kround{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--muted);
       text-transform:uppercase}
  .kdone{text-align:center;padding:14px 0}
  .kdone b{display:block;font-size:clamp(26px,6vw,40px);font-family:var(--font)}
  .kdone p{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
  .kdone .row{display:flex;gap:8px;justify-content:center}
  .piece .pja.big{font-size:30px}
  .kbig{font-family:var(--jp);font-size:clamp(56px,14vw,96px);line-height:1.1}
  /* ---- the verb card ---- */
  .vcard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
       border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;
       background:var(--paper);margin-bottom:10px}
  .vicon{font-size:40px;line-height:1}
  .vask{flex:1;min-width:140px}
  .vask .big{font-size:26px}
  .vask p{font-size:12.5px;color:var(--muted)}
  .vwant{text-align:right}
  .vwant b{display:block;font-size:15px}
  .vwant .tag{font-size:10.5px;letter-spacing:.08em;color:var(--muted)}

  /* ---- read it fast ---- */
  .bigline{font-size:clamp(19px,4.4vw,30px);line-height:2;text-align:center;
       margin:6px 0}
  .icons{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
  .icons .pic{font-size:26px}
  .clock{text-align:center;font-size:30px;font-weight:700;color:var(--deep);
       font-variant-numeric:tabular-nums;min-height:1.2em}
  @media (max-width:560px){
    .box{width:92px}
    .hole{height:50px}
    .hole .pic{font-size:32px}
    .matchgrid{gap:7px}
  }
  /* a 360px phone: five boxes and fifteen words have to fit the width,
     because a sentence that scrolls sideways cannot be read as a
     sentence */
  @media (max-width:420px){
    .box{width:70px;padding:5px 3px 4px;border-radius:9px}
    .hole{height:42px}
    .hole .pic{font-size:26px}
    .hole .pja{font-size:13px}
    .box .part{font-size:16px}
    .box .ask{font-size:9px}
    .frame{gap:5px}
    .tray{gap:5px}
    .piece{min-width:46px;padding:4px 5px}
    .piece.word{min-width:62px}
    .piece .pja{font-size:15px}
    .piece .pic{font-size:27px}
    .qq{width:18px;height:18px;line-height:15px;font-size:10px}
    .target{font-size:14px}
  }
</style>
